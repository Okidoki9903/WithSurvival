<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#dfeaf3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Polar Camp</title>
  <meta name="description" content="Chasse les ours polaires, cuisine la viande et fais tourner ton camp ! Moteur en Rust (WebAssembly), rendu three.js.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻‍❄️</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="logo"><span class="l1">POLAR</span><span class="l2">CAMP</span></div>
    <div id="money"><span class="bill">$</span><span id="money-val">0</span></div>
    <div id="buttons">
      <button id="btn-sound" title="Son">🔊</button>
      <button id="btn-reset" title="Recommencer">↺</button>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="vignette"></div>
  </div>

  <div id="joy"><div id="joy-knob"></div></div>

  <div id="start">
    <div class="card">
      <div class="big">🐻‍❄️</div>
      <h1>POLAR CAMP</h1>
      <ol>
        <li>🪓 Chasse les ours polaires</li>
        <li>🍖 Apporte la viande au hachoir</li>
        <li>🔥 Fais griller les steaks</li>
        <li>🧑‍🤝‍🧑 Sers les clients et encaisse 💵</li>
        <li>⬆️ Achète des améliorations sur les dalles</li>
      </ol>
      <p class="ctrl">Glisse le doigt n'importe où pour bouger<br><small>(clavier : ZQSD / WASD / flèches)</small></p>
      <button id="play" disabled>Chargement…</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
