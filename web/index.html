<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dfe9f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WithSurvival — Fort-Aube</title>
<meta name="description" content="Chassez les ours polaires, faites tourner le chaudron, nourrissez les rescapés et bâtissez Fort-Aube au cœur des Terres Blanches.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<link rel="stylesheet" href="style.css?v=2">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="c" aria-label="Monde 3D de WithSurvival"></canvas>
<div id="touch"></div>
<div id="fx-layer"></div>

<div id="hud">
  <div id="money" aria-label="Billets"><span class="bill"><i></i></span><span id="money-val">0</span></div>
  <div id="objective"><img id="objective-icon" alt=""><span id="objective-text"></span></div>
  <div id="top-right">
    <button id="btn-sound" aria-label="Son"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="btn-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
  </div>
  <div id="dialog" role="status" aria-live="polite">
    <div id="dialog-avatar">B</div>
    <div class="dialog-body"><div class="dialog-head"><b id="dialog-name"></b><span id="dialog-role"></span></div><p id="dialog-text"></p></div>
  </div>
  <div id="banner"><div id="banner-num"></div><div id="banner-title"></div><div id="banner-sub"></div></div>
</div>

<div id="joy"><div id="joy-knob"></div></div>

<div id="menu">
  <div class="card">
    <div class="logo small"><span class="l1">WITHSURVIVAL</span><span class="l2">FORT-AUBE</span></div>
    <button id="menu-resume" class="btn primary">Reprendre</button>
    <button id="menu-reset" class="btn ghost">Recommencer l’aventure</button>
    <p class="hint">Glisse n’importe où pour te déplacer. Tout se fait en marchant : chasser, ramasser, déposer, acheter.</p>
  </div>
</div>

<div id="start">
  <div class="start-inner">
    <div class="logo"><span class="l1">WITHSURVIVAL</span><span class="l2">FORT-AUBE</span></div>
    <p class="tagline">Le Grand Gel a tout figé. Bâtis un refuge, nourris les rescapés, rallume l’aube.</p>
    <div class="tap"><span class="hand"></span><span id="tap-text">Touchez pour jouer</span></div>
    <div id="loading">Chargement des Terres Blanches…</div>
  </div>
</div>

<script type="module" src="src/main.js?v=2"></script>
<script>
  // If modules fail (very old browser / WebGL missing), say so instead of a white page.
  window.addEventListener('error', function (e) {
    var l = document.getElementById('loading');
    if (l) l.textContent = 'Impossible de lancer le jeu : ' + (e.message || 'erreur WebGL');
  });
</script>
</body>
</html>
